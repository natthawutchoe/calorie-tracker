<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Calorie Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fff;--surface:#f6f6f4;--surface-2:#efefec;--border:#e4e4e1;--text:#111;--muted:#767672;--inverse:#fff;--good:#16764a;--bad:#b42318;--accent:#0f766e;color-scheme:light}
    [data-theme=dark]{--bg:#0a0a0a;--surface:#171717;--surface-2:#1f1f1e;--border:#2b2b2a;--text:#f3f3f1;--muted:#8c8c88;--inverse:#0a0a0a;--good:#5ee0a0;--bad:#ff8b7b;--accent:#5eead4;color-scheme:dark}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body,button,select{font-family:"Sarabun",sans-serif}button,select{-webkit-tap-highlight-color:transparent}
    .screen{min-height:100svh;max-width:980px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 40px}
    .masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border)}
    .overline{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .title{font-family:"Noto Serif Thai",serif;font-size:30px;line-height:1.15;font-weight:400;margin-top:4px}
    .actions{display:flex;gap:8px;flex:0 0 auto}.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text);display:grid;place-items:center}
    .controls{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:18px 0}.field,.select-btn{min-height:42px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);padding:0 12px}.select-btn.active{background:var(--text);color:var(--inverse);border-color:var(--text)}
    .range{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.panel{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:15px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi-label{color:var(--muted);font-size:12px}.kpi-value{font-family:"Space Mono",monospace;font-size:27px;font-weight:700;line-height:1.15;margin-top:8px}.kpi-note{color:var(--muted);font-size:12px;margin-top:6px}
    .chart-wrap{margin-top:14px}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:12px}.chart-title{font-family:"Noto Serif Thai",serif;font-size:22px}.chart{height:260px;display:flex;align-items:end;gap:7px;padding:16px 10px 10px;border:1px solid var(--border);border-radius:8px;background:linear-gradient(to bottom,var(--surface),transparent)}
    .bar-col{min-width:18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px}.bar-stack{width:100%;height:200px;display:flex;align-items:end;justify-content:center;position:relative}.target{position:absolute;width:100%;border-top:2px dashed color-mix(in srgb,var(--accent) 65%,transparent)}.bar{width:min(100%,32px);border-radius:6px 6px 2px 2px;background:var(--text);min-height:2px}.bar.over{background:var(--bad)}.bar.under{background:var(--accent)}.bar-label{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted);white-space:nowrap}
    .line-chart{width:100%;height:170px;color:var(--accent);overflow:visible}
    table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}th,td{text-align:left;padding:11px 6px;border-top:1px solid var(--border)}th{color:var(--muted);font-weight:500;font-size:12px}td.num{text-align:right;font-family:"Space Mono",monospace}.good{color:var(--good)}.bad{color:var(--bad)}
    .empty,.status{color:var(--muted);text-align:center;padding:34px 12px}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(8px)}.load-card{width:min(100%,320px);border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:22px;text-align:center;box-shadow:0 16px 42px rgba(0,0,0,.12)}.spinner{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--text);animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:720px){.screen{padding-left:14px;padding-right:14px}.controls{grid-template-columns:1fr}.range{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.chart{overflow-x:auto}.bar-col{flex:0 0 34px}.title{font-size:27px}}
  </style>
</head>
<body>
  <main id="app" class="screen"><div class="status">loading</div></main>
  <script>
    const SHEET_API="https://script.google.com/macros/s/AKfycbyfnswtymcZFyFjDrpqwnKYWlARrfO0-7-9ATve6SmOTL7p8hLQsN6ldikV589_VDWXXg/exec";
    const qp=new URLSearchParams(location.search);
    const S={theme:localStorage.getItem("calorie-dashboard:theme")||"light",users:[],userId:qp.get("user")||localStorage.getItem("calorie-dashboard:userId")||"",range:7,profiles:{},logs:{},weights:{},loading:true,notice:""};
    document.documentElement.dataset.theme=S.theme;
    const $=s=>document.querySelector(s);
    const nf=n=>Number(n||0).toLocaleString("th-TH");
    const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const add=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
    const thai=s=>new Date(s+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short"});
    async function fetchTimeout(url,ms=20000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{cache:"no-store",signal:c.signal})}finally{clearTimeout(t)}}
    async function get(key){const r=await fetchTimeout(`${SHEET_API}?key=${encodeURIComponent(key)}&t=${Date.now()}`);const j=await r.json();if(!j.ok)throw Error(j.error||"sheet error");return j.value}
    async function getMany(keys){const r=await fetchTimeout(`${SHEET_API}?keys=${encodeURIComponent(JSON.stringify(keys))}&t=${Date.now()}`,20000);const j=await r.json();if(!j.ok)throw Error(j.error||"sheet error");return j.values||{}}
    function target(p){if(!p||!p.age||!p.height||!p.weight)return 0;const b=(10*p.weight)+(6.25*p.height)-(5*p.age)+(p.gender==="male"?5:-161);const a={light:1.375,moderate:1.55,active:1.725}[p.activity]||1.2;return Math.round(b*a+(p.goalDirection==="lose"?-(p.surplus||300):(p.surplus||300)))}
    function dates(){const n=S.range==="all"?90:Number(S.range);const t=iso(new Date());return Array.from({length:n},(_,i)=>add(t,i-n+1))}
    async function load(){S.loading=true;S.notice="";render();try{S.users=JSON.parse(await get("users")||"[]").filter(u=>u&&u.id&&u.name);if(!S.users.some(u=>u.id===S.userId))S.userId=S.users[0]?.id||"";await loadUser()}catch(e){S.notice=e.name==="AbortError"?"Apps Script ตอบช้า ลองกดรีเฟรชอีกครั้ง":(e.message||String(e))}S.loading=false;render()}
    async function loadUser(){if(!S.userId)return;localStorage.setItem("calorie-dashboard:userId",S.userId);const ds=dates(),keys=[`user:${S.userId}:profile`,...ds.flatMap(d=>[`user:${S.userId}:log:${d}`,`user:${S.userId}:weight:${d}`])],values=await getMany(keys);try{S.profiles[S.userId]=JSON.parse(values[`user:${S.userId}:profile`]||"{}")}catch{S.profiles[S.userId]={}};S.logs[S.userId]={};S.weights[S.userId]={};ds.forEach(d=>{try{S.logs[S.userId][d]=JSON.parse(values[`user:${S.userId}:log:${d}`]||"[]")}catch{S.logs[S.userId][d]=[]}try{const wr=values[`user:${S.userId}:weight:${d}`]||"";S.weights[S.userId][d]=wr?JSON.parse(wr):null}catch{S.weights[S.userId][d]=null}})}
    function rows(){return dates().map(date=>{const entries=S.logs[S.userId]?.[date]||[];const total=entries.reduce((a,e)=>a+Number(e.kcal||0),0);return{date,total,count:entries.length}})}
    function weightRows(){return dates().map(date=>({date,weight:Number(S.weights[S.userId]?.[date]?.weightKg||0)}))}
    function avgWeight(list){const v=list.filter(d=>d.weight);return v.length?Math.round(v.reduce((a,d)=>a+d.weight,0)/v.length*10)/10:0}
    function weightChart(list){const pts=list.filter(d=>d.weight);if(pts.length<2)return'<div class="empty">บันทึกน้ำหนักอย่างน้อย 2 วันเพื่อดูกราฟ</div>';const min=Math.min(...pts.map(d=>d.weight)),max=Math.max(...pts.map(d=>d.weight)),span=max-min||1,w=640,h=150,step=w/(pts.length-1);const points=pts.map((d,i)=>`${Math.round(i*step)},${Math.round(h-((d.weight-min)/span*h))}`).join(" ");return `<svg viewBox="0 0 ${w} ${h}" class="line-chart" role="img"><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((d,i)=>`<circle cx="${Math.round(i*step)}" cy="${Math.round(h-((d.weight-min)/span*h))}" r="4" fill="currentColor"><title>${d.date}: ${d.weight} kg</title></circle>`).join("")}</svg>`}
    function insight(avg,goal,delta,weightCount){if(weightCount<4)return"บันทึกน้ำหนักต่ออีกสัก 4 วันขึ้นไป ระบบจะอ่านแนวโน้มได้ดีขึ้น";if(goal&&avg>goal&&delta>0)return"แคลเฉลี่ยสูงกว่าเป้า และน้ำหนักเฉลี่ยเริ่มขึ้น ร่างกายกำลังตอบสนอง";if(goal&&avg>goal&&delta<=0)return"แคลเฉลี่ยสูงกว่าเป้า แต่น้ำหนักยังไม่ขึ้น ลองเช็กการซิงก์หรือเพิ่มอีก 100-150 kcal";if(delta>0)return"น้ำหนักเริ่มขึ้นแล้ว ดูคู่กับการซ้อมเวทและรอบเอวเพื่อประเมิน lean gain";return"น้ำหนักยังนิ่งหรือลดลง ต้องดูแคลเฉลี่ยและความสม่ำเสมอเพิ่ม"}
    function render(){const p=S.profiles[S.userId]||{},goal=target(p),data=rows(),tracked=data.filter(d=>d.count||d.total),latest=[...tracked].pop(),avg=tracked.length?Math.round(tracked.reduce((a,d)=>a+d.total,0)/tracked.length):0,delta=latest?latest.total-goal:0,max=Math.max(goal,...data.map(d=>d.total),1),today=iso(new Date()),fresh=latest&&latest.date===today,wdata=weightRows(),wtracked=wdata.filter(d=>d.weight),wlatest=[...wtracked].pop(),wavg7=avgWeight(wdata.slice(-7)),wavgPrev=avgWeight(wdata.slice(-14,-7)),wavg30=avgWeight(wdata),wdelta7=wavg7&&wavgPrev?Math.round((wavg7-wavgPrev)*10)/10:0,wfirst=wtracked[0],wdelta30=wlatest&&wfirst?Math.round((wlatest.weight-wfirst.weight)*10)/10:0;$("#app").innerHTML=`<section class="masthead"><div><div class="overline">sheet dashboard</div><div class="title">ภาพรวมแคลอรี่</div></div><div class="actions"><a class="icon-btn" href="./index.html" aria-label="tracker">${icon("home")}</a><button class="icon-btn" data-act="theme" aria-label="theme">${icon("moon")}</button><button class="icon-btn" data-act="refresh" aria-label="refresh">${icon("refresh")}</button></div></section><section class="controls"><select class="field" data-act="user">${S.users.map(u=>`<option value="${u.id}" ${u.id===S.userId?"selected":""}>${u.name}</option>`).join("")}</select><div class="range">${[7,14,30,"all"].map(r=>`<button class="select-btn ${S.range===r?"active":""}" data-act="range" data-range="${r}">${r==="all"?"90 วัน":r+" วัน"}</button>`).join("")}</div></section>${S.notice?`<div class="panel bad">${S.notice}</div>`:""}${latest&&!fresh?`<div class="panel">ข้อมูลล่าสุดในชีต: ${thai(latest.date)} · วันนี้ยังไม่มีข้อมูลที่ซิงก์ขึ้นชีต</div>`:""}<section class="grid kpis"><div class="panel"><div class="kpi-label">เฉลี่ยต่อวัน</div><div class="kpi-value">${nf(avg)}</div><div class="kpi-note">kcal</div></div><div class="panel"><div class="kpi-label">วันล่าสุดในชีต</div><div class="kpi-value">${latest?nf(latest.total):"0"}</div><div class="kpi-note">${latest?thai(latest.date):"ยังไม่มีข้อมูล"}</div></div><div class="panel"><div class="kpi-label">เป้าต่อวัน</div><div class="kpi-value">${goal?nf(goal):"-"}</div><div class="kpi-note">จากโปรไฟล์</div></div><div class="panel"><div class="kpi-label">เกิน/ขาด ล่าสุด</div><div class="kpi-value ${delta>0?"bad":"good"}">${latest&&goal?(delta>0?"+":"")+nf(delta):"-"}</div><div class="kpi-note">เทียบเป้า</div></div></section><section class="grid kpis" style="margin-top:12px"><div class="panel"><div class="kpi-label">น้ำหนักล่าสุด</div><div class="kpi-value">${wlatest?nf(wlatest.weight):"-"}</div><div class="kpi-note">${wlatest?thai(wlatest.date)+" · kg":"ยังไม่มีข้อมูล"}</div></div><div class="panel"><div class="kpi-label">เฉลี่ย 7 วัน</div><div class="kpi-value">${wavg7?nf(wavg7):"-"}</div><div class="kpi-note">kg</div></div><div class="panel"><div class="kpi-label">เทียบสัปดาห์ก่อน</div><div class="kpi-value ${wdelta7>0?"good":wdelta7<0?"bad":""}">${wavg7&&wavgPrev?(wdelta7>0?"+":"")+nf(wdelta7):"-"}</div><div class="kpi-note">kg</div></div><div class="panel"><div class="kpi-label">เปลี่ยนในช่วงนี้</div><div class="kpi-value ${wdelta30>0?"good":wdelta30<0?"bad":""}">${wlatest&&wfirst?(wdelta30>0?"+":"")+nf(wdelta30):"-"}</div><div class="kpi-note">kg</div></div></section><section class="panel" style="margin-top:12px"><div class="kpi-label">Insight</div><div style="margin-top:6px">${insight(avg,goal,wdelta7,wtracked.length)}</div></section><section class="chart-wrap"><div class="chart-head"><div><div class="overline">weight trend</div><div class="chart-title">แนวโน้มน้ำหนัก</div></div><div class="kpi-note">${wtracked.length} วันที่มีบันทึก</div></div><div class="chart" style="height:210px;align-items:center">${weightChart(wdata)}</div></section><section class="chart-wrap"><div class="chart-head"><div><div class="overline">${S.users.find(u=>u.id===S.userId)?.name||""}</div><div class="chart-title">แคลรายวันเทียบเป้า</div></div><div class="kpi-note">${tracked.length} วันที่มีบันทึก · ${latest?`ล่าสุด ${thai(latest.date)}`:"ยังไม่มีข้อมูล"}</div></div><div class="chart">${data.map(d=>`<div class="bar-col" title="${d.date}: ${d.total} kcal"><div class="bar-stack"><span class="target" style="bottom:${goal/max*100}%"></span><span class="bar ${goal&&d.total>goal?"over":"under"}" style="height:${d.total/max*100}%"></span></div><div class="bar-label">${thai(d.date)}</div></div>`).join("")}</div></section><section><table><thead><tr><th>วันที่</th><th class="num">แคล</th><th class="num">รายการ</th><th class="num">ต่างจากเป้า</th></tr></thead><tbody>${[...data].reverse().filter(d=>d.total||d.count).map(d=>`<tr><td>${thai(d.date)}</td><td class="num">${nf(d.total)}</td><td class="num">${d.count}</td><td class="num ${d.total-goal>0?"bad":"good"}">${goal?(d.total-goal>0?"+":"")+nf(d.total-goal):"-"}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">ยังไม่มีข้อมูลในช่วงนี้</td></tr>`}</tbody></table></section>${S.loading?`<div class="loader"><div class="load-card"><div class="spinner"></div><div class="title" style="font-size:20px">กำลังดึงข้อมูล</div><div class="kpi-note">อ่านข้อมูลจาก Google Sheet</div></div></div>`:""}`;bind()}
    function bind(){document.querySelectorAll("button[data-act],a[data-act]").forEach(el=>el.onclick=async()=>{const a=el.dataset.act;if(a==="theme"){S.theme=S.theme==="light"?"dark":"light";localStorage.setItem("calorie-dashboard:theme",S.theme);document.documentElement.dataset.theme=S.theme;render()}if(a==="refresh")await load();if(a==="range"){S.range=el.dataset.range==="all"?"all":Number(el.dataset.range);S.loading=true;render();await loadUser();S.loading=false;render()}});document.querySelectorAll("select[data-act='user']").forEach(el=>el.onchange=async()=>{S.userId=el.value;S.loading=true;render();await loadUser();S.loading=false;render()})}
    function icon(n){return{home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 7.4A9 9 0 1 1 12 3Z"/></svg>',refresh:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 16h6v6"/><path d="M3 12A9 9 0 0 1 18 5.3L21 8"/><path d="M21 8h-6V2"/></svg>'}[n]}
    load();
  </script>
</body>
</html>
