<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="แคลอรี">
  <title>แคลอรี</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#fff; --surface:#f6f6f4; --surface-2:#efefec; --border:#e4e4e1; --text:#111; --muted:#767672; --inverse:#fff; color-scheme:light; }
    [data-theme="dark"] { --bg:#0a0a0a; --surface:#171717; --surface-2:#1f1f1e; --border:#2b2b2a; --text:#f3f3f1; --muted:#8c8c88; --inverse:#0a0a0a; color-scheme:dark; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body, button, input { font-family:"Sarabun", sans-serif; }
    body { transition:background .25s ease, color .25s ease; }
    button { -webkit-tap-highlight-color:transparent; cursor:pointer; }
    .screen,.onboard { min-height:100svh; max-width:480px; margin:0 auto; }
    .screen { padding-bottom:calc(98px + env(safe-area-inset-bottom)); }
    .onboard { padding:calc(30px + env(safe-area-inset-top)) 24px 36px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:calc(24px + env(safe-area-inset-top)) 24px 16px; border-bottom:1px solid var(--border); }
    .overline { font-family:"Space Mono", monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    .title { font-family:"Noto Serif Thai", serif; font-size:28px; line-height:1.2; font-weight:400; }
    .display { font-family:"Noto Serif Thai", serif; }
    .mono { font-family:"Space Mono", monospace; }
    .icon-row { display:flex; gap:8px; }
    .icon-btn { width:38px; height:38px; border-radius:999px; border:1px solid var(--border); color:var(--text); background:transparent; display:grid; place-items:center; flex:0 0 auto; }
    .icon-btn:disabled { opacity:.32; }
    .date-switcher { display:flex; align-items:center; justify-content:center; gap:18px; padding:20px 24px 0; }
    .date-label { min-width:136px; text-align:center; color:var(--muted); font-family:"Space Mono", monospace; font-size:12px; }
    .gauge-wrap { display:grid; place-items:center; padding:32px 24px 20px; }
    .gauge { position:relative; width:192px; height:192px; }
    .gauge-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .gauge-number { font-family:"Space Mono", monospace; font-weight:700; font-size:34px; line-height:1; }
    .hint { color:var(--muted); font-size:14px; text-align:center; margin-top:14px; line-height:1.45; }
    .section { padding:0 24px; margin-top:26px; }
    .section-head { margin-bottom:12px; }
    .food-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .food-btn,.entry-empty,.panel,.field,.select-btn { border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--text); }
    .food-btn { min-height:86px; padding:13px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
    .food-card { border:1px solid var(--border); border-radius:8px; padding:12px; display:grid; gap:10px; }
    .food-card-main { border:0; background:transparent; color:var(--text); min-height:56px; padding:0; text-align:left; display:flex; flex-direction:column; justify-content:space-between; gap:8px; }
    .food-card-actions { display:flex; justify-content:flex-end; }
    .estimate-box { margin-top:12px; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
    .estimate-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .estimate-title { font-size:14px; line-height:1.35; }
    .estimate-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    .food-name { font-size:14px; line-height:1.35; overflow-wrap:anywhere; }
    .food-kcal,.entry-meta,.small-mono { color:var(--muted); font-size:12px; font-family:"Space Mono", monospace; }
    .food-tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
    .primary { width:100%; border:0; border-radius:8px; background:var(--text); color:var(--inverse); min-height:48px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:500; }
    .primary:disabled { opacity:.4; }
    .secondary { width:100%; border:0; background:transparent; color:var(--muted); min-height:44px; }
    .add-manual { margin-top:14px; }
    .entry { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-top:1px solid var(--border); }
    .entry:first-child { border-top:0; }
    .entry-name { font-size:14px; overflow-wrap:anywhere; }
    .entry-empty { padding:24px 12px; color:var(--muted); text-align:center; font-size:14px; }
    .sync-panel { padding:14px; border:1px solid var(--border); border-radius:8px; }
    .sync-panel p { margin:6px 0 12px; color:var(--muted); font-size:13px; line-height:1.45; }
    .sync-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .small-btn { min-height:40px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); }
    .user-strip { display:flex; gap:8px; overflow-x:auto; padding:16px 24px 0; }
    .user-pill { border:1px solid var(--border); border-radius:999px; min-height:36px; padding:0 13px; background:transparent; color:var(--muted); white-space:nowrap; }
    .user-pill.active { background:var(--text); color:var(--inverse); border-color:var(--text); }
    .danger-btn { color:#b42318; border-color:#f3b6ad; }
    .bottom-nav { position:fixed; left:0; right:0; bottom:0; padding:16px 24px calc(22px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 62%,transparent); }
    .nav-inner { max-width:432px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border:1px solid var(--border); border-radius:999px; }
    .nav-btn { border:0; border-radius:999px; min-height:38px; background:transparent; color:var(--muted); font-weight:500; }
    .nav-btn.active { background:var(--text); color:var(--inverse); }
    .modal-backdrop { position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.44); padding-top:36px; }
    .modal { width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--border); border-radius:16px 16px 0 0; padding:18px 24px calc(28px + env(safe-area-inset-bottom)); }
    .modal-top { display:flex; justify-content:flex-end; margin-bottom:4px; }
    .manage-list { display:grid; gap:8px; max-height:34svh; overflow:auto; margin:12px 0 16px; }
    .manage-item { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
    .manage-item:first-child { border-top:0; }
    .field { width:100%; min-height:44px; padding:10px 12px; outline:none; color:var(--text); background:transparent; }
    .field-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
    .field-row .field { flex:1; }
    .onboard-copy { color:var(--muted); font-size:14px; line-height:1.55; margin:6px 0 24px; }
    .label { color:var(--muted); font-size:12px; margin:14px 0 7px; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .seg.three { grid-template-columns:repeat(3,1fr); }
    .select-btn { min-height:42px; padding:10px 12px; text-align:center; }
    .select-btn.active { background:var(--text); color:var(--inverse); border-color:var(--text); }
    .activity { display:grid; gap:8px; }
    .activity .select-btn { text-align:left; line-height:1.35; }
    .preview { margin:20px 0; padding:15px; }
    .preview-line { display:flex; justify-content:space-between; gap:12px; font-size:14px; }
    .preview-line + .preview-line { margin-top:10px; }
    .toast { position:fixed; z-index:60; left:16px; right:16px; top:calc(14px + env(safe-area-inset-top)); max-width:448px; margin:0 auto; border:0; border-radius:8px; padding:12px 14px; background:var(--text); color:var(--inverse); text-align:center; }
    .toast small { display:block; opacity:.7; margin-top:3px; overflow-wrap:anywhere; }
    .status { min-height:100svh; display:grid; place-items:center; color:var(--muted); }
    @media (max-width:360px){ .food-grid{grid-template-columns:1fr;} .title{font-size:25px;} }
  </style>
</head>
<body>
  <div id="app" class="status"><span class="overline">loading</span></div>
  <script>
    const SHEET_API = "https://script.google.com/macros/s/AKfycbyfnswtymcZFyFjDrpqwnKYWlARrfO0-7-9ATve6SmOTL7p8hLQsN6ldikV589_VDWXXg/exec";
    const LOCAL_PREFIX = "calorie-tracker:";
    const FOODS = [];
    const ACTIVITY = [
      {key:"sedentary",label:"นั่งทำงาน ไม่ค่อยขยับ",mult:1.2},
      {key:"light",label:"ออกกำลังกายเบา ๆ 1-3 วัน/สัปดาห์",mult:1.375},
      {key:"moderate",label:"ออกกำลังกายปานกลาง 3-5 วัน/สัปดาห์",mult:1.55},
      {key:"active",label:"ออกกำลังกายหนัก 6-7 วัน/สัปดาห์",mult:1.725}
    ];
    const CALORIE_DB = [
      {name:"ข้าวมันไก่",kcal:590,serving:"1 จาน",source:"กรมอนามัย 558-619 kcal",aliases:["ข้าวมันไก่ต้ม","มันไก่"]},
      {name:"ข้าวมันไก่ไม่หนัง",kcal:520,serving:"1 จาน",source:"ประมาณจากกรมอนามัย",aliases:["ข้าวมันไก่ไม่เอาหนัง","ไก่ไม่หนัง"]},
      {name:"ข้าวกะเพราหมูสับไข่ดาว",kcal:630,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["กระเพราหมูไข่ดาว","กะเพราหมูไข่ดาว","ผัดกะเพราไข่ดาว"]},
      {name:"ข้าวกะเพราไก่",kcal:520,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["กระเพราไก่","กะเพราไก่"]},
      {name:"ข้าวขาหมู",kcal:690,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ขาหมู"]},
      {name:"ข้าวหมูแดง",kcal:560,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["หมูแดง"]},
      {name:"ข้าวหน้าเป็ด",kcal:550,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["หน้าเป็ด"]},
      {name:"ข้าวผัดหมู",kcal:560,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ข้าวผัด"]},
      {name:"ข้าวผัดกุ้ง",kcal:540,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ข้าวผัดทะเล"]},
      {name:"ข้าวไข่เจียว",kcal:450,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ไข่เจียวราดข้าว"]},
      {name:"ข้าวต้มหมูสับ",kcal:250,serving:"1 ชาม",source:"ประมาณจาก Thai FCD",aliases:["ข้าวต้มหมู","โจ๊กหมู"]},
      {name:"ผัดไทยใส่ไข่",kcal:500,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ผัดไทย","ผัดไทยกุ้ง"]},
      {name:"ผัดซีอิ๊วหมู",kcal:600,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ผัดซีอิ๊ว","ผัดซีอิ้ว"]},
      {name:"ราดหน้าเส้นใหญ่หมู",kcal:430,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ราดหน้า","ราดหน้าหมู"]},
      {name:"ก๋วยเตี๋ยวหมูน้ำใส",kcal:350,serving:"1 ชาม",source:"ประมาณจาก Thai FCD",aliases:["ก๋วยเตี๋ยวหมู","ก๋วยเตี๋ยวน้ำใส"]},
      {name:"ก๋วยเตี๋ยวเรือ",kcal:380,serving:"1 ชาม",source:"ประมาณจาก Thai FCD",aliases:["เตี๋ยวเรือ"]},
      {name:"เย็นตาโฟ",kcal:420,serving:"1 ชาม",source:"ประมาณจาก Thai FCD",aliases:["ก๋วยเตี๋ยวเย็นตาโฟ"]},
      {name:"สุกี้น้ำไก่",kcal:330,serving:"1 ชาม",source:"ประมาณจาก Thai FCD",aliases:["สุกี้น้ำ","สุกี้ไก่"]},
      {name:"สุกี้แห้งไก่",kcal:430,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["สุกี้แห้ง"]},
      {name:"ขนมจีนน้ำยา",kcal:360,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ขนมจีน"]},
      {name:"แกงเขียวหวานไก่กับข้าว",kcal:550,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["แกงเขียวหวานไก่","เขียวหวานไก่"]},
      {name:"ต้มยำกุ้งกับข้าว",kcal:450,serving:"1 จาน",source:"ประมาณจาก Thai FCD",aliases:["ต้มยำกุ้ง","ต้มยำ"]},
      {name:"ส้มตำไทย",kcal:185,serving:"1 จาน",source:"ประมาณจากส่วนประกอบ",aliases:["ส้มตำ","ตำไทย"]},
      {name:"ลาบไก่",kcal:290,serving:"1 จาน",source:"ประมาณจากส่วนประกอบ",aliases:["ลาบ"]},
      {name:"ไก่ย่าง",kcal:260,serving:"1 ชิ้น",source:"ประมาณจาก Thai FCD",aliases:["ไก่ย่างน่องสะโพก"]},
      {name:"ข้าวเหนียว",kcal:160,serving:"1 ห่อเล็ก",source:"Thai FCD/กรมอนามัย",aliases:["ข้าวเหนียวหนึ่งห่อ"]},
      {name:"ข้าวสวย",kcal:160,serving:"2 ทัพพี",source:"กรมอนามัย",aliases:["ข้าวเปล่า","ข้าว"]},
      {name:"ไข่ต้ม",kcal:80,serving:"1 ฟอง",source:"Thai FCD",aliases:["ไข่"]},
      {name:"ไข่ดาว",kcal:165,serving:"1 ฟอง",source:"ประมาณจาก Thai FCD",aliases:["ไข่ทอด"]},
      {name:"กล้วยน้ำว้า",kcal:100,serving:"1 ผล",source:"Thai FCD",aliases:["กล้วย"]},
      {name:"นมถั่วเหลืองหวานน้อย",kcal:120,serving:"1 แก้ว",source:"ประมาณจากฉลากทั่วไป",aliases:["นมถั่วเหลือง","น้ำเต้าหู้"]},
      {name:"ข้าวเหนียวมะม่วง",kcal:450,serving:"1 ชุด",source:"ประมาณจากส่วนประกอบ",aliases:["ข้าวเหนียวมูนมะม่วง"]},
      {name:"กล้วยทอด",kcal:250,serving:"1 ถุงเล็ก",source:"ประมาณจากส่วนประกอบ",aliases:["กล้วยแขก"]},
      {name:"น้ำอัดลม",kcal:150,serving:"1 กระป๋อง",source:"ประมาณจากฉลากทั่วไป",aliases:["โค้ก","เป๊ปซี่"]}
    ];
    const state = { loaded:false, theme:localStorage.getItem(LOCAL_PREFIX+"theme")||"light", users:[], currentUserId:"", profile:null, foods:[], tab:"home", viewDate:todayISO(), logs:{}, modal:null, notice:"", syncing:false };
    let autoSyncTimer=null;

    function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
    function addDaysISO(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
    function thaiDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}); }
    function readJson(key,fallback){ try{ const raw=localStorage.getItem(LOCAL_PREFIX+key); return raw?JSON.parse(raw):fallback; }catch{return fallback;} }
    function writeJson(key,value){ localStorage.setItem(LOCAL_PREFIX+key,JSON.stringify(value)); }
    function storageKey(key){ return state.currentUserId ? `user:${state.currentUserId}:${key}` : key; }
    function userLabel(){ return state.users.find(u=>u.id===state.currentUserId)?.name || "ผู้ใช้"; }
    function normalizeUsers(users){ return (users||[]).filter(u=>u&&u.id&&u.name).map(u=>({id:String(u.id),name:String(u.name)})); }
    function normalizeFoods(foods){ return (foods||[]).filter(f=>f&&f.id&&f.name&&Number(f.kcal)>0).map(f=>({id:String(f.id),name:String(f.name),kcal:Number(f.kcal)})); }
    function saveUsers(){ writeJson("users",state.users); localStorage.setItem(LOCAL_PREFIX+"currentUserId",state.currentUserId); }
    async function restoreUsersFromSheet(){
      const localUsers=normalizeUsers(readJson("users",[]));
      const localCurrent=localStorage.getItem(LOCAL_PREFIX+"currentUserId") || localUsers[0]?.id || "";
      const localProfile=localCurrent ? readJson(`user:${localCurrent}:profile`,null) : null;
      if(localUsers.length && localProfile) return;
      try{
        const remoteUsersRaw=await sheetGet("users");
        const remoteUsers=normalizeUsers(JSON.parse(remoteUsersRaw||"[]"));
        if(remoteUsers.length){
          state.users=remoteUsers;
          state.currentUserId=remoteUsers[0].id;
          saveUsers();
        }
      }catch{}
    }
    function migrateUsers(){
      state.users=normalizeUsers(readJson("users",[]));
      state.currentUserId=localStorage.getItem(LOCAL_PREFIX+"currentUserId") || state.users[0]?.id || "";
      if(!state.users.length){
        const id="u-"+Date.now().toString(36);
        state.users=[{id,name:"ผู้ใช้หลัก"}];
        state.currentUserId=id;
        const legacyProfile=readJson("profile",null);
        if(legacyProfile) writeJson(`user:${id}:profile`,legacyProfile);
        Object.keys(localStorage).filter(k=>k.startsWith(LOCAL_PREFIX+"log:")).forEach(k=>{
          localStorage.setItem(LOCAL_PREFIX+`user:${id}:${k.slice(LOCAL_PREFIX.length)}`,localStorage.getItem(k));
        });
        saveUsers();
      }
      if(!state.users.some(u=>u.id===state.currentUserId)) state.currentUserId=state.users[0].id;
      state.profile=readJson(storageKey("profile"),null);
      state.foods=normalizeFoods(readJson(storageKey("foods"),[]));
    }
    function bmiCategory(bmi){ if(bmi<18.5)return"น้ำหนักน้อย"; if(bmi<23)return"ปกติ"; if(bmi<25)return"ท้วม"; if(bmi<30)return"อ้วน"; return"อ้วนมาก"; }
    function metrics(p=state.profile){ if(!p)return{target:0,bmi:0}; const bmr=p.gender==="male"?10*p.weight+6.25*p.height-5*p.age+5:10*p.weight+6.25*p.height-5*p.age-161; const mult=(ACTIVITY.find(a=>a.key===p.activity)||ACTIVITY[0]).mult; return{target:Math.round(bmr*mult+Number(p.surplus||500)),bmi:p.weight/Math.pow(p.height/100,2)}; }
    function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
    function cleanText(text){ return String(text||"").toLowerCase().replace(/\s+/g,"").replace(/เผ็ด|ไม่เผ็ด|พิเศษ|ธรรมดา|ใส่ถุง/g,""); }
    function findCalorieEstimate(text){
      const q=cleanText(text);
      if(q.length<2)return null;
      let best=null;
      CALORIE_DB.forEach(item=>{
        const names=[item.name,...(item.aliases||[])].map(cleanText);
        let score=0;
        names.forEach(name=>{
          if(q===name)score=Math.max(score,100);
          else if(name.includes(q)||q.includes(name))score=Math.max(score,80);
          else if(q.length>=4&&name.includes(q.slice(0,4)))score=Math.max(score,45);
        });
        if(!best||score>best.score)best={...item,score};
      });
      return best&&best.score>=45?best:null;
    }
    function renderEstimate(id){
      const input=document.getElementById(id);
      const box=document.querySelector(`[data-estimate-for="${id}"]`);
      if(!input||!box)return;
      const estimate=findCalorieEstimate(input.value);
      if(!estimate){ box.innerHTML=`<div class="hint" style="text-align:left;margin:0">พิมพ์ชื่อเมนูเพื่อให้ระบบเดาค่าแคลจากฐานข้อมูลในแอป</div>`; return; }
      box.innerHTML=`<div class="estimate-top"><div><div class="estimate-title">${estimate.name}</div><div class="food-kcal">${estimate.serving} · ${estimate.source}</div></div><strong class="mono">${estimate.kcal} kcal</strong></div><div class="estimate-actions"><button class="small-btn" data-action="use-estimate" data-target="${id}" data-kcal="${estimate.kcal}">ใช้ค่านี้</button><button class="small-btn" data-action="adjust-estimate" data-target="${id}" data-kcal="${estimate.kcal}">ปรับเอง</button></div>`;
      bindEstimateButtons(box);
    }
    function bindEstimateButtons(root=document){
      root.querySelectorAll("[data-action='use-estimate'],[data-action='adjust-estimate']").forEach(btn=>btn.addEventListener("click",()=>{
        const target=btn.dataset.target==="food-name"?"food-kcal":"manual-kcal";
        const kcal=document.getElementById(target);
        if(kcal){ kcal.value=btn.dataset.kcal; if(btn.dataset.action==="adjust-estimate")kcal.focus(); }
      }));
    }
    function icon(name){ const p={plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="m20 6-11 11-5-5"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',trash:'<path d="M3 6h18M8 6V4h8v2M7 6l1 14h8l1-14"/>',moon:'<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',settings:'<path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 8.92 4a1.65 1.65 0 0 0 1-1.51V2a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.22.61.8 1 1.45 1H21a2 2 0 0 1 0 4h-.09c-.65 0-1.23.39-1.51 1Z"/>'}; return `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||""}</svg>`; }

    async function init(){
      document.documentElement.dataset.theme=state.theme;
      await restoreUsersFromSheet();
      migrateUsers();
      await syncBootstrap();
      await loadLog(state.viewDate,true);
      state.loaded=true;
      render();
      if(state.profile) queueAutoSync();
    }
    async function fetchTimeout(url,options={},ms=3500){ const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),ms); try{return await fetch(url,{...options,signal:ctrl.signal});} finally{clearTimeout(timer);} }
    async function sheetGet(key){ const res=await fetchTimeout(`${SHEET_API}?key=${encodeURIComponent(key)}`,{cache:"no-store"}); if(!res.ok)throw new Error(`HTTP ${res.status}`); const data=await res.json(); if(!data.ok)throw new Error(data.error||"unknown error"); return data.value; }
    async function sheetSet(key,value){ const res=await fetchTimeout(SHEET_API,{method:"POST",body:JSON.stringify({key,value})},15000); if(!res.ok)throw new Error(`HTTP ${res.status}`); const data=await res.json(); if(!data.ok)throw new Error(data.error||"unknown error"); }
    async function sheetSetMany(items){
      const res=await fetchTimeout(SHEET_API,{method:"POST",body:JSON.stringify({items})},7000);
      if(!res.ok)throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      if(!data.ok)throw new Error(data.error||"unknown error");
    }
    async function syncBootstrap(){
      try{
        const remoteUsers=await sheetGet("users");
        if(remoteUsers){
          const merged=[...state.users];
          normalizeUsers(JSON.parse(remoteUsers)).forEach(u=>{ if(!merged.some(x=>x.id===u.id)) merged.push(u); });
          state.users=merged; saveUsers();
        }
      }catch{}
      try{ const remoteProfile=await sheetGet(storageKey("profile")); if(remoteProfile){ state.profile=JSON.parse(remoteProfile); writeJson(storageKey("profile"),state.profile); } }catch{}
      try{ const remoteFoods=await sheetGet(storageKey("foods")); if(remoteFoods){ state.foods=normalizeFoods(JSON.parse(remoteFoods)); writeJson(storageKey("foods"),state.foods); } }catch{}
    }
    async function syncUpload(silent=false){
      if(state.syncing)return;
      state.syncing=true;
      try{
      const items=[
        {key:"users",value:JSON.stringify(state.users)},
        {key:storageKey("profile"),value:JSON.stringify(state.profile)},
        {key:storageKey("foods"),value:JSON.stringify(state.foods)},
        {key:storageKey(`log:${state.viewDate}`),value:JSON.stringify(state.logs[state.viewDate]||[])}
      ];
      try{
        await sheetSetMany(items);
      }catch(err){
        if(!/missing key|unknown action/i.test(err.message||""))throw err;
        await Promise.all(items.map(item=>sheetSet(item.key,item.value)));
      }
      if(!silent){
        state.notice=`ซิงก์ข้อมูลของ ${userLabel()} แล้ว`;
        render();
      }
      }finally{
        state.syncing=false;
      }
    }
    function queueAutoSync(){
      if(!state.currentUserId)return;
      clearTimeout(autoSyncTimer);
      autoSyncTimer=setTimeout(()=>syncUpload(true).catch(()=>{}),1200);
    }
    async function syncDownload(){ await syncBootstrap(); const log=await sheetGet(storageKey(`log:${state.viewDate}`)); if(log){ state.logs[state.viewDate]=JSON.parse(log); writeJson(storageKey(`log:${state.viewDate}`),state.logs[state.viewDate]); } state.notice=`ดึงข้อมูลของ ${userLabel()} แล้ว`; render(); }
    async function loadLog(iso,force=false){ if(state.logs[iso]&&!force)return; state.logs[iso]=readJson(storageKey(`log:${iso}`),[]); }
    function persistProfile(p){ state.profile=p; writeJson(storageKey("profile"),p); state.tab="home"; render(); queueAutoSync(); }
    function persistLog(iso,entries){ state.logs[iso]=entries; writeJson(storageKey(`log:${iso}`),entries); render(); queueAutoSync(); }
    function addEntry(name,kcal){ const iso=state.viewDate; const entry={id:uid(),name,kcal:Number(kcal),time:new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}; persistLog(iso,[...(state.logs[iso]||[]),entry]); state.modal=null; render(); }
    function deleteEntry(id){ persistLog(state.viewDate,(state.logs[state.viewDate]||[]).filter(e=>e.id!==id)); }
    function saveFoods(){ state.foods=normalizeFoods(state.foods); writeJson(storageKey("foods"),state.foods); render(); queueAutoSync(); }
    function createFood(name,kcal){ const clean=name.trim(); const calories=Number(kcal); if(!clean||calories<=0)return; state.foods=[...state.foods,{id:uid(),name:clean,kcal:calories}]; state.modal=null; saveFoods(); }
    function deleteFood(id){ state.foods=state.foods.filter(f=>f.id!==id); saveFoods(); }
    function openDate(iso){ state.viewDate=iso; loadLog(iso); render(); }
    function setTheme(next){ state.theme=next; localStorage.setItem(LOCAL_PREFIX+"theme",next); document.documentElement.dataset.theme=next; render(); }
    async function switchUser(id){
      if(!state.users.some(u=>u.id===id)) return;
      state.currentUserId=id;
      localStorage.setItem(LOCAL_PREFIX+"currentUserId",id);
      state.profile=readJson(storageKey("profile"),null);
      state.foods=normalizeFoods(readJson(storageKey("foods"),[]));
      state.logs={};
      await loadLog(state.viewDate,true);
      state.tab=state.profile ? "home" : "settings";
      render();
    }
    async function createUser(name){
      const clean=name.trim();
      if(!clean) return;
      const id="u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      state.users.push({id,name:clean});
      state.currentUserId=id;
      state.profile=null;
      state.foods=[];
      state.logs={};
      state.modal=null;
      state.tab="settings";
      saveUsers();
      await loadLog(state.viewDate,true);
      render();
      queueAutoSync();
    }
    async function deleteCurrentUser(){
      if(state.users.length<=1){ state.notice="ต้องมีผู้ใช้อย่างน้อย 1 คน"; state.modal=null; render(); return; }
      const deletingId=state.currentUserId;
      state.users=state.users.filter(u=>u.id!==deletingId);
      state.currentUserId=state.users[0].id;
      state.profile=readJson(storageKey("profile"),null);
      state.foods=normalizeFoods(readJson(storageKey("foods"),[]));
      state.logs={};
      state.modal=null;
      state.tab=state.profile ? "home" : "settings";
      saveUsers();
      await loadLog(state.viewDate,true);
      state.notice="ลบผู้ใช้แล้ว กำลังซิงก์รายชื่อขึ้น Google Sheets";
      render();
      queueAutoSync();
    }

    function render(){ const app=document.getElementById("app"); document.querySelector('meta[name="theme-color"]').setAttribute("content",state.theme==="dark"?"#0a0a0a":"#ffffff"); if(!state.loaded){ app.className="status"; app.innerHTML='<span class="overline">loading</span>'; return; } app.className=""; app.innerHTML=(!state.profile||state.tab==="settings")?renderOnboard():renderHome(); bind(); }
    function renderHome(){ const {target}=metrics(); const entries=state.logs[state.viewDate]||[]; const eaten=entries.reduce((s,e)=>s+Number(e.kcal),0); const pct=target?Math.min(100,Math.round(eaten/target*100)):0; const remaining=target-eaten; return `<main class="screen"><header class="masthead"><div><div class="overline">${userLabel()}</div><div class="title">${state.viewDate===todayISO()?"วันนี้":thaiDate(state.viewDate)}</div></div><div class="icon-row"><button class="icon-btn" data-action="theme" aria-label="สลับธีม">${icon(state.theme==="light"?"moon":"sun")}</button><button class="icon-btn" data-action="settings" aria-label="ตั้งค่า">${icon("settings")}</button></div></header>${renderUserSwitcher()}${state.tab==="history"?renderDateSwitcher():""}<section class="gauge-wrap">${renderGauge(pct,eaten,target)}<div class="hint">${remaining>0?`อีก <span class="mono" style="color:var(--text)">${remaining}</span> แคล ถึงเป้าวันนี้`:`<span style="color:var(--text)">ถึงเป้าแล้ววันนี้</span>`}</div></section>${state.tab==="home"?renderFoodList():""}${renderEntries(entries)}${renderSync()}${renderNav()}${renderModal()}${renderToast()}</main>`; }
    function renderGauge(pct,eaten,target){ const r=78,cc=Math.PI*2*r,offset=cc-pct/100*cc; return `<div class="gauge"><svg width="192" height="192" viewBox="0 0 192 192"><circle cx="96" cy="96" r="${r}" fill="none" stroke="var(--border)" stroke-width="1.5"></circle><circle cx="96" cy="96" r="${r}" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="${cc}" stroke-dashoffset="${offset}" transform="rotate(-90 96 96)"></circle></svg><div class="gauge-center"><div class="gauge-number">${eaten}</div><div class="small-mono">/ ${target||"-"} kcal</div></div></div>`; }
    function renderDateSwitcher(){ return `<div class="date-switcher"><button class="icon-btn" data-action="prev-date">${icon("left")}</button><div class="date-label">${thaiDate(state.viewDate)}</div><button class="icon-btn" data-action="next-date" ${state.viewDate>=todayISO()?"disabled":""}>${icon("right")}</button></div>`; }
    function renderUserSwitcher(){ return `<div class="user-strip">${state.users.map(u=>`<button class="user-pill ${u.id===state.currentUserId?"active":""}" data-action="switch-user" data-id="${u.id}">${u.name}</button>`).join("")}<button class="user-pill" data-action="add-user">+ เพิ่มผู้ใช้</button>${state.users.length>1?`<button class="user-pill danger-btn" data-action="ask-delete-user">ลบผู้ใช้นี้</button>`:""}</div>`; }
    function renderFoodList(){ const foods=state.foods||[]; return `<section class="section"><div class="section-head overline">เมนูที่กินบ่อย · ${userLabel()}</div>${foods.length?`<div class="food-grid">${foods.map(f=>`<div class="food-card"><button class="food-card-main" data-action="eat-food" data-id="${f.id}"><span class="food-name">${f.name}</span><span class="food-kcal">${f.kcal} kcal</span></button><div class="food-card-actions"><button class="icon-btn" data-action="delete-food" data-id="${f.id}" aria-label="ลบเมนู">${icon("trash")}</button></div></div>`).join("")}</div>`:`<div class="entry-empty">ยังไม่มีเมนูที่กินบ่อยของผู้ใช้นี้</div>`}<div class="food-tools"><button class="primary" data-action="food">${icon("plus")}<span>เพิ่มเมนูที่กินบ่อย</span></button><button class="small-btn" data-action="manual">เพิ่มอาหารครั้งเดียว</button></div></section>`; }
    function renderEntries(entries){ return `<section class="section"><div class="section-head overline">รายการ (${entries.length})</div>${entries.length?`<div>${entries.map(e=>`<div class="entry"><div><div class="entry-name">${e.name}</div><div class="entry-meta">${e.time} · ${e.kcal} kcal</div></div>${state.viewDate===todayISO()?`<button class="icon-btn" data-action="delete" data-id="${e.id}">${icon("trash")}</button>`:""}</div>`).join("")}</div>`:`<div class="entry-empty">ยังไม่มีรายการในวันนี้</div>`}</section>`; }
    function renderSync(){ return `<section class="section"><div class="sync-panel"><div class="overline">Sync · ${userLabel()}</div><p>ปุ่มนี้ซิงก์เฉพาะผู้ใช้ที่เลือกอยู่ รวมถึงโปรไฟล์ เมนูที่กินบ่อย และรายการวันนี้ โดยใช้ key แยก เช่น <span class="mono">user:${state.currentUserId}:foods</span></p><div class="sync-actions"><button class="small-btn" data-action="sync-up">ส่งขึ้นชีต</button><button class="small-btn" data-action="sync-down">ดึงจากชีต</button></div></div></section>`; }

    function renderModal(){

      if(state.modal.type==="food")return `<div class="modal-backdrop" data-action="close-modal"><div class="modal">${close}<div class="display" style="font-size:22px;margin-bottom:16px">เพิ่มเมนูที่กินบ่อย</div><input id="food-name" class="field" data-calorie-name="food-name" placeholder="ชื่ออาหาร เช่น ข้าวมันไก่"><div class="estimate-box" data-estimate-for="food-name"><div class="hint" style="text-align:left;margin:0">พิมพ์ชื่อเมนูเพื่อให้ระบบเดาค่าแคลจากฐานข้อมูลในแอป</div></div><div class="field-row"><input id="food-kcal" class="field mono" type="number" inputmode="numeric" placeholder="แคลอรี"><span class="small-mono">kcal</span></div><button class="primary" style="margin-top:16px" data-action="confirm-food">${icon("check")}<span>บันทึกเมนู</span></button></div></div>`;
      if(state.modal.type==="user")return `<div class="modal-backdrop" data-action="close-modal"><div class="modal">${close}<div class="display" style="font-size:22px;margin-bottom:16px">เพิ่มผู้ใช้งาน</div><input id="user-name" class="field" placeholder="ชื่อผู้ใช้ เช่น คุณพ่อ"><button class="primary" style="margin-top:16px" data-action="confirm-user">${icon("check")}<span>สร้างผู้ใช้</span></button></div></div>`;

      return `<div class="modal-backdrop" data-action="close-modal"><div class="modal">${close}<div class="display" style="font-size:22px;margin-bottom:16px">เพิ่มอาหารครั้งเดียว</div><input id="manual-name" class="field" data-calorie-name="manual-name" placeholder="ชื่ออาหาร เช่น ผัดไทย"><div class="estimate-box" data-estimate-for="manual-name"><div class="hint" style="text-align:left;margin:0">พิมพ์ชื่อเมนูเพื่อให้ระบบเดาค่าแคลจากฐานข้อมูลในแอป</div></div><div class="field-row"><input id="manual-kcal" class="field mono" type="number" inputmode="numeric" placeholder="แคลอรี"><span class="small-mono">kcal</span></div><button class="primary" style="margin-top:16px" data-action="confirm-manual">${icon("check")}<span>เพิ่มรายการ</span></button></div></div>`;
    }
    function renderToast(){ return state.notice?`<button class="toast" data-action="clear-notice"><strong>${state.notice}</strong></button>`:""; }
    function renderOnboard(){ const p=state.profile||{gender:"male",age:"",height:"",weight:"",activity:"sedentary",surplus:500}; return `<main class="onboard"><div class="overline">${userLabel()}</div><div class="title">โปรไฟล์</div><p class="onboard-copy">ใช้คำนวณแคลที่ควรกินต่อวันเพื่อเพิ่มน้ำหนักอย่างเหมาะสม จาก BMI, BMR และระดับกิจกรรม</p>${renderUserSwitcher()}<div class="label">เพศ</div><div class="seg"><button class="select-btn ${p.gender==="male"?"active":""}" data-profile="gender" data-value="male">ชาย</button><button class="select-btn ${p.gender==="female"?"active":""}" data-profile="gender" data-value="female">หญิง</button></div>${field("age","อายุ (ปี)",p.age,"เช่น 21")}${field("height","ส่วนสูง (ซม.)",p.height,"เช่น 170")}${field("weight","น้ำหนักปัจจุบัน (กก.)",p.weight,"เช่น 55")}<div class="label">กิจกรรมต่อวัน</div><div class="activity">${ACTIVITY.map(a=>`<button class="select-btn ${p.activity===a.key?"active":""}" data-profile="activity" data-value="${a.key}">${a.label}</button>`).join("")}</div><div class="label">แคลส่วนเกินต่อวัน</div><div class="seg three">${[300,500,750].map(s=>`<button class="select-btn mono ${Number(p.surplus)===s?"active":""}" data-profile="surplus" data-value="${s}">+${s}</button>`).join("")}</div><div class="hint" style="text-align:left;margin:8px 0 0">+500 แคล/วัน ≈ น้ำหนักขึ้นราว 0.5 กก./สัปดาห์โดยประมาณ</div>${renderPreview(p)}<button class="primary" data-action="save-profile">บันทึกโปรไฟล์</button>${state.profile?`<button class="secondary" data-action="cancel-settings">ยกเลิก</button>`:""}${renderModal()}${renderToast()}</main>`; }
    function field(key,label,value,placeholder){ return `<div class="label">${label}</div><input class="field mono" data-profile-input="${key}" type="number" inputmode="numeric" value="${value||""}" placeholder="${placeholder}">`; }
    function currentDraft(){ const existing=state.profile||{}; return { gender:document.querySelector('[data-profile="gender"].active')?.dataset.value||existing.gender||"male", age:Number(document.querySelector('[data-profile-input="age"]')?.value||existing.age||0), height:Number(document.querySelector('[data-profile-input="height"]')?.value||existing.height||0), weight:Number(document.querySelector('[data-profile-input="weight"]')?.value||existing.weight||0), activity:document.querySelector('[data-profile="activity"].active')?.dataset.value||existing.activity||"sedentary", surplus:Number(document.querySelector('[data-profile="surplus"].active')?.dataset.value||existing.surplus||500) }; }
    function renderPreview(p){ if(!Number(p.age)||!Number(p.height)||!Number(p.weight))return'<div style="height:20px"></div>'; const m=metrics(p); return `<div class="panel preview"><div class="preview-line"><span style="color:var(--muted)">BMI ปัจจุบัน</span><span class="mono">${m.bmi.toFixed(1)} · ${bmiCategory(m.bmi)}</span></div><div class="preview-line"><span style="color:var(--muted)">เป้าแคลต่อวัน</span><strong class="mono">${m.target} kcal</strong></div></div>`; }
    function refreshPreview(){ const panel=document.querySelector(".preview"); const html=renderPreview(currentDraft()); if(panel)panel.outerHTML=html; }
    function bind(){ document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",async ev=>{ const a=el.dataset.action; try{ if(a==="theme")setTheme(state.theme==="light"?"dark":"light"); if(a==="settings"){state.tab="settings";render();} if(a==="switch-user")await switchUser(el.dataset.id); if(a==="add-user"){state.modal={type:"user"};render();setTimeout(()=>document.getElementById("user-name")?.focus(),0);} if(a==="confirm-user")await createUser(document.getElementById("user-name")?.value||""); if(a==="ask-delete-user"){state.modal={type:"delete-user"};render();} if(a==="confirm-delete-user")await deleteCurrentUser(); if(a==="prev-date")openDate(addDaysISO(state.viewDate,-1)); if(a==="next-date"&&state.viewDate<todayISO())openDate(addDaysISO(state.viewDate,1)); if(a==="eat-food"){const f=state.foods.find(item=>item.id===el.dataset.id); if(f)addEntry(f.name,f.kcal);} if(a==="delete-food")deleteFood(el.dataset.id); if(a==="food"){state.modal={type:"food"}; render(); setTimeout(()=>document.getElementById("food-name")?.focus(),0);} if(a==="manual"){state.modal={type:"manual"}; render(); setTimeout(()=>document.getElementById("manual-name")?.focus(),0);} if(a==="close-modal"&&(ev.target===el||el.classList.contains("icon-btn"))){state.modal=null;render();} if(a==="confirm-quick"){const kcal=Number(document.getElementById("modal-kcal").value); if(kcal>0)addEntry(state.modal.name,kcal);} if(a==="confirm-food")createFood(document.getElementById("food-name")?.value||"",document.getElementById("food-kcal")?.value||0); if(a==="confirm-manual"){const name=document.getElementById("manual-name").value.trim(); const kcal=Number(document.getElementById("manual-kcal").value); if(name&&kcal>0)addEntry(name,kcal);} if(a==="delete")deleteEntry(el.dataset.id); if(a==="tab"){state.tab=el.dataset.tab; if(state.tab==="home")openDate(todayISO()); else render();} if(a==="save-profile"){const p=currentDraft(); if(p.age>0&&p.height>0&&p.weight>0)persistProfile(p);} if(a==="cancel-settings"){state.tab="home";render();} if(a==="sync-up"){state.notice="กำลังส่งขึ้นชีต...";render(); await syncUpload();} if(a==="sync-down"){state.notice="กำลังดึงจากชีต...";render(); await syncDownload();} if(a==="clear-notice"){state.notice="";render();} }catch(err){state.notice="ซิงก์ไม่สำเร็จ: "+(err.name==="AbortError"?"Apps Script ไม่ตอบภายในเวลา":(err.message||err));render();} })); document.querySelectorAll("[data-profile]").forEach(el=>el.addEventListener("click",()=>{ const g=el.dataset.profile; document.querySelectorAll(`[data-profile="${g}"]`).forEach(i=>i.classList.remove("active")); el.classList.add("active"); refreshPreview(); })); document.querySelectorAll("[data-profile-input]").forEach(el=>el.addEventListener("input",refreshPreview)); document.querySelectorAll("[data-calorie-name]").forEach(el=>el.addEventListener("input",()=>renderEstimate(el.id))); }
    if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    init();
  </script>
</body>
</html>
